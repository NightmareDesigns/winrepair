name: Build WinPE ISO

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: WinPE architecture
        required: true
        type: choice
        default: amd64
        options:
          - amd64
          - arm64

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Windows ADK
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2196127" -OutFile "$env:TEMP\adksetup.exe"
          Start-Process -FilePath "$env:TEMP\adksetup.exe" -ArgumentList "/quiet /norestart /ceip off /features OptionId.DeploymentTools" -Wait -NoNewWindow

      - name: Install Windows ADK WinPE Add-on
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2196224" -OutFile "$env:TEMP\adkwinpesetup.exe"
          Start-Process -FilePath "$env:TEMP\adkwinpesetup.exe" -ArgumentList "/quiet /norestart /ceip off /features OptionId.WindowsPreinstallationEnvironment" -Wait -NoNewWindow

      - name: Verify ADK installation
        shell: pwsh
        run: |
          $copype = "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment\copype.cmd"
          if (-not (Test-Path $copype)) {
            Write-Error "WinPE tools were not installed correctly. Missing: $copype"
          }

      - name: Build WinPE ISO
        shell: cmd
        env:
          CI: true
          WINREPAIR_ARCH: ${{ inputs.architecture }}
        run: |
          build\build_winpe_iso.bat

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: winrepair-${{ inputs.architecture }}-iso
          path: winrepair_${{ inputs.architecture }}.iso
          if-no-files-found: error
