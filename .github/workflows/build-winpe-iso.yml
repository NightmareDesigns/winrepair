name: Build WinPE ISO

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: WinPE architecture
        required: true
        type: choice
        default: amd64
        options:
          - amd64
          - arm64

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Windows ADK
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2196127" -OutFile "$env:TEMP\adksetup.exe"
          Start-Process -FilePath "$env:TEMP\adksetup.exe" -ArgumentList "/quiet /norestart /ceip off /features OptionId.DeploymentTools" -Wait -NoNewWindow

      - name: Install Windows ADK WinPE Add-on
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $adkInstallPath = "${env:ProgramFiles(x86)}\Windows Kits\10"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2196224" -OutFile "$env:TEMP\adkwinpesetup.exe"
          Start-Process -FilePath "$env:TEMP\adkwinpesetup.exe" -ArgumentList "/quiet /norestart /ceip off /installpath `"$adkInstallPath`" /features OptionId.WindowsPreinstallationEnvironment" -Wait -NoNewWindow

      - name: Verify ADK installation
        shell: pwsh
        run: |
          $adkRoot = "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit"
          $copype = Join-Path $adkRoot "Windows Preinstallation Environment\copype.cmd"

          if (-not (Test-Path $copype)) {
            Write-Error "WinPE tools were not installed correctly. Missing: $copype"
          }

          $amd64Media = Join-Path $adkRoot "Windows Preinstallation Environment\amd64\Media"
          $arm64Media = Join-Path $adkRoot "Windows Preinstallation Environment\arm64\Media"

          Write-Host "copype.cmd found at: $copype"
          Write-Host "amd64 media present: $(Test-Path $amd64Media)"
          Write-Host "arm64 media present: $(Test-Path $arm64Media)"

          if (-not (Test-Path $amd64Media)) {
            Write-Host "::warning::amd64 WinPE media was not found in the default ADK location. This runner image may not support building amd64 WinPE with the installed add-on."
          }

      - name: Build WinPE ISO
        shell: cmd
        env:
          CI: true
          WINREPAIR_ARCH: ${{ inputs.architecture }}
        run: |
          if /I "${{ inputs.architecture }}"=="amd64" if not exist "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Windows Preinstallation Environment\amd64\Media" (
            echo amd64 WinPE media is unavailable on this runner image.
            echo Please use arm64 or a self-hosted runner with a full ADK + WinPE add-on installation.
            exit /b 1
          )
          call "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\DandISetEnv.bat"
          call "%GITHUB_WORKSPACE%\build\build_winpe_iso.bat"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: winrepair-${{ inputs.architecture }}-iso
          path: winrepair_${{ inputs.architecture }}.iso
          if-no-files-found: error
